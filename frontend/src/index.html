<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Late Fee Video</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/del.css">
</head>
<body>
<div id="stage">
  <div id="bg"><div class="bgl"></div><div class="bgb"></div></div>

  <div id="del" data-state="idle"><div id="delBlock"><div id="delStand"><div class="lamp"></div><canvas width="86" height="72"></canvas></div><div id="delShadow"></div><div id="delFig"><div class="anim"></div><div class="anim"></div></div></div></div>

  <div id="tape"><span class="lbl" data-t="tape"></span><span id="tapeVal">0000</span></div>

  <div id="tv">
    <div id="screen"></div>
    <div id="reels"></div>
    <div id="tvFrame"></div>
    <svg id="lines" preserveAspectRatio="none"></svg>
    <div id="osd"></div>
    <div id="rec" class="hide">● REC</div>
    <div id="tracking" class="hide"></div>
    <div id="spinWin" class="hide"></div>
  </div>

  <div id="side">
    <div id="fsBox" class="hide"><span class="lbl" data-t="freeSpins"></span><b id="fsVal">0/0</b></div>
    <div id="multBox" class="hide"><span class="lbl" data-t="rewindMult"></span><b id="multVal">×2</b></div>
    <div id="tapeLog" class="hide"></div>
  </div>

  <button id="buyBtn" class="btn" data-t="catalog"></button>
  <button id="anteBtn" class="btn toggle"><span data-t="ante"></span> <b id="anteState">OFF</b></button>

  <div id="hud">
    <div class="field" id="balField"><span class="lbl" data-t="balance"></span><b id="balVal">—</b></div>
    <div class="field" id="betField">
      <button id="betMinus" class="btn round" aria-label="">−</button>
      <div><span class="lbl" data-t="bet"></span><b id="betVal">—</b></div><span id="anteTag" class="hide"></span>
      <button id="betPlus" class="btn round" aria-label="">+</button>
    </div>
    <div class="field" id="winField"><span class="lbl" data-t="win"></span><b id="winVal">—</b></div>
    <button id="menuBtn" class="btn round" aria-label="">☰</button>
    <button id="soundBtn" class="btn round" aria-label="">♪</button>
    <button id="turboBtn" class="btn round" aria-label="">»</button>
    <button id="autoBtn" class="btn round" aria-label="">⟳</button>
    <button id="spinBtn" class="btn" aria-label="">▶</button>
  </div>

  <div id="fx"></div>
  <div id="toast" class="hide"></div>

  <!-- overlays -->
  <div id="bigWin" class="overlay hide"><video id="bigVideo" muted loop playsinline preload="none"><source src="assets/overlay/ov_bigwin.mp4" type="video/mp4"><source src="assets/overlay/ov_bigwin.webm" type="video/webm"></video><div id="bigFx" class="ov-fx"></div><div class="ov-inner"><div id="bigBadge"></div><div id="bigTitle"></div><div id="bigAmt"></div><small data-t="tapToSkip"></small></div></div>
  <div id="banner" class="overlay hide"><video id="bannerVideo" class="hide" muted playsinline preload="none"></video><img id="bannerImg" class="hide" alt=""><div class="ov-inner"><div id="bannerTitle"></div><div id="bannerSub"></div><small data-t="tapToContinue"></small></div></div>
</div>

<!-- dialogs (outside stage scaling for readability) -->
<div id="dlgBack" class="hide"></div>
<div id="buyDlg" class="dlg hide" role="dialog">
  <h2 data-t="catalog"></h2>
  <div id="buyList"></div>
  <div id="buyConfirm" class="hide"><p id="buyConfirmText"></p><button id="buyYes" class="btn" data-t="confirm"></button><button id="buyNo" class="btn" data-t="cancel"></button></div>
  <button class="btn close" data-close aria-label="">✕</button>
</div>
<div id="autoDlg" class="dlg hide" role="dialog">
  <h2 data-t="autoplay"></h2>
  <div class="row"><span data-t="autoSpins"></span><div id="autoCounts"></div></div>
  <label class="row"><input type="checkbox" id="autoStopBonus" checked> <span data-t="autoStopBonus"></span></label>
  <label class="row"><span data-t="autoStopWin"></span> <select id="autoStopWin"><option value="0">—</option><option>20</option><option>100</option><option>500</option></select></label>
  <label class="row"><span data-t="autoStopLoss"></span> <select id="autoStopLoss"><option value="0">—</option><option>10</option><option>50</option><option>100</option></select></label>
  <button id="autoStart" class="btn" data-t="start"></button>
  <button class="btn close" data-close aria-label="">✕</button>
</div>
<div id="rulesDlg" class="dlg wide hide" role="dialog"><div id="rulesBody"></div><button class="btn close" data-close aria-label="">✕</button></div>

<div id="splash"><div class="blue">
  <div id="splashLogo"></div>
  <div class="osd-big">PLAY ▶</div>
  <div class="title">LATE FEE VIDEO</div>
  <div id="loadCounter">0000</div>
  <button id="splashBtn" class="btn" disabled></button>
</div></div>

<div id="errScreen" class="hide"><div class="err-inner"><div class="osd-big" data-t="errTitle"></div><p id="errText"></p><button id="errBtn" class="btn" data-t="reload"></button></div></div>

<div id="replayCard" class="hide"></div>
<div id="devPanel" class="hide"></div>

<script src="js/mathdata.js"></script>
<script src="js/reelstrips.js"></script>
<script src="js/lang.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/del.js"></script>
<script src="js/net.js"></script>
<script src="js/reels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
