<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Late Fee Video</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/del.css">
</head>
<body>
<!-- one icon set for every control (24×24, stroked in the button colour) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3.5 9.5H7l4.5-4v13L7 14.5H3.5z" fill="currentColor" stroke-width="1.6"/><path d="M15 9a4.2 4.2 0 0 1 0 6M17.8 6.3a8 8 0 0 1 0 11.4"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3.5 9.5H7l4.5-4v13L7 14.5H3.5z" fill="currentColor" stroke-width="1.6"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></symbol>
  <symbol id="i-turbo" viewBox="0 0 24 24"><path d="M13.5 2.5 5 13.5h6l-1.5 8 8.5-11h-6z" fill="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.8 3.8V8h-4.2"/><path d="M10.2 9.2v5.6l4.6-2.8z" fill="currentColor" stroke-width="1.2"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><path d="M5 11a7.2 7.2 0 0 1 12.6-4.1"/><path d="M18.4 3.6v3.9h-3.9"/><path d="M19 13a7.2 7.2 0 0 1-12.6 4.1"/><path d="M5.6 20.4v-3.9h3.9"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
  <symbol id="i-tape" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2"/><circle cx="8.3" cy="11.3" r="2"/><circle cx="15.7" cy="11.3" r="2"/><path d="M8.3 13.3h7.4M6.5 18.5l1.6-2.6h7.8l1.6 2.6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A8 8 0 1 1 9.4 4.5a6.4 6.4 0 0 0 10.1 10.1z" fill="currentColor" stroke-width="1.4"/></symbol>
</svg>
<div id="stage">
  <div id="bg"><div class="bgl"></div><div class="bgb"></div></div>

  <div id="del" data-state="idle"><div id="delStand"><div class="lamp"></div><canvas width="86" height="72"></canvas></div><div id="delBlock"><div id="delShadow"></div><div id="delFig"><canvas></canvas></div></div></div>

  <div id="counter"><div class="cl"></div><div class="cb"></div></div>

  <div id="tape"><span class="lbl" data-t="tape"></span><span id="tapeVal">0000</span></div>

  <div id="tv">
    <div id="screen"></div>
    <div id="reels"></div>
    <div id="tvFrame"><video class="loop" muted loop playsinline preload="none"></video><div class="st win"></div><div class="st bonus"></div></div>
    <svg id="lines" preserveAspectRatio="none"></svg>
    <div id="osd"></div>
    <div id="rec" class="hide">● REC</div>
    <div id="tracking" class="hide"></div>
    <div id="spinWin" class="hide"></div>
    <div id="sparks"></div>
    <div id="winCount" class="hide"></div>
  </div>

  <div id="side">
    <div id="fsBox" class="hide"><span class="lbl" data-t="freeSpins"></span><b id="fsVal">0/0</b></div>
    <div id="multBox" class="hide"><span class="lbl" data-t="rewindMult"></span><b id="multVal">×2</b></div>
    <div id="feeBox" class="hide"><span class="lbl" data-t="lateFeeLbl"></span><b><i id="feeDays">00</i> <span id="feeVal">×1</span></b></div>
    <div id="tapeLog" class="hide"></div>
  </div>

  <button id="buyBtn" class="pill"><svg class="ic"><use href="#i-tape"/></svg><span data-t="catalog"></span></button>
  <button id="anteBtn" class="pill toggle"><svg class="ic"><use href="#i-moon"/></svg><span data-t="ante"></span> <b id="anteState">OFF</b></button>

  <!-- bet bar: one deck across the bottom (it bleeds into the letterbox); portrait splits it into a value row and a control row -->
  <div id="deck"></div>
  <div id="hud">
    <button id="menuBtn" class="ib" aria-label=""><svg class="ic"><use href="#i-menu"/></svg></button>
    <button id="soundBtn" class="ib" aria-label=""><svg class="ic"><use href="#i-sound"/></svg></button>
    <div class="field" id="balField"><span class="lbl" data-t="balance"></span><b id="balVal">—</b></div>
    <div class="betGrp">
      <button id="betMinus" class="ib step" aria-label=""><svg class="ic"><use href="#i-minus"/></svg></button>
      <div class="field" id="betField"><button id="betPick" class="pick" aria-haspopup="dialog" aria-label=""><span class="lbl"><span data-t="bet"></span><svg class="ic chev"><use href="#i-chev"/></svg></span><b id="betVal">—</b></button><span id="anteTag" class="hide"></span></div>
      <button id="betPlus" class="ib step" aria-label=""><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
    <div class="field" id="winField"><span class="lbl" data-t="win"></span><b id="winVal">0.00</b></div>
    <button id="turboBtn" class="ib" aria-label=""><svg class="ic"><use href="#i-turbo"/></svg></button>
    <button id="spinBtn" aria-label="" data-state="idle"><span class="cap"><svg class="ic"><use href="#i-spin"/></svg><span id="spinN"></span></span></button>
    <button id="autoBtn" class="ib" aria-label=""><svg class="ic"><use href="#i-auto"/></svg></button>
  </div>

  <div id="fx"></div>
  <div id="toast" class="hide"></div>

  <!-- overlays -->
  <div id="bigWin" class="overlay scene hide"><div id="bigScene"></div><div id="bigFx" class="ov-fx"></div><div class="ov-inner"><div id="bigTitle"></div><div id="bigAmt"></div><small data-t="tapToSkip"></small></div></div>
  <div id="banner" class="overlay hide"><video id="bannerVideo" class="hide" muted playsinline preload="none"></video><img id="bannerImg" class="hide" alt=""><div class="ov-inner"><div id="bannerTitle"></div><div id="bannerSub"></div><small data-t="tapToContinue"></small></div></div>
</div>

<!-- dialogs (outside stage scaling for readability) -->
<div id="dlgBack" class="hide"></div>
<div id="buyDlg" class="dlg hide" role="dialog">
  <h2 data-t="catalog"></h2>
  <div id="buyList"></div>
  <button class="btn close" data-close aria-label="">✕</button>
</div>
<!-- purchase confirmation: its own window over the catalog -->
<div id="askBack" class="hide"></div>
<div id="buyConfirm" class="dlg ask hide" role="alertdialog" aria-modal="true" aria-labelledby="buyAskName" aria-describedby="buyConfirmText" tabindex="-1">
  <img id="buyAskImg" alt="">
  <h2 id="buyAskName"></h2>
  <p id="buyAskPrice"></p>
  <p id="buyConfirmText"></p>
  <div class="row"><button id="buyYes" class="btn" data-t="confirm"></button><button id="buyNo" class="btn" data-t="cancel"></button></div>
</div>
<div id="betDlg" class="dlg hide" role="dialog">
  <h2 data-t="bet"></h2>
  <div id="betList"></div>
  <button class="btn close" data-close aria-label="">✕</button>
</div>
<div id="autoDlg" class="dlg hide" role="dialog">
  <h2 data-t="autoplay"></h2>
  <div class="row"><span data-t="autoSpins"></span><div id="autoCounts"></div></div>
  <label class="row"><input type="checkbox" id="autoStopBonus" checked> <span data-t="autoStopBonus"></span></label>
  <label class="row"><span data-t="autoStopWin"></span> <select id="autoStopWin"><option value="0">—</option><option>20</option><option>100</option><option>500</option></select></label>
  <label class="row"><span data-t="autoStopLoss"></span> <select id="autoStopLoss"><option value="0">—</option><option>10</option><option>50</option><option>100</option></select></label>
  <button id="autoStart" class="btn" data-t="start"></button>
  <button class="btn close" data-close aria-label="">✕</button>
</div>
<div id="rulesDlg" class="dlg wide hide" role="dialog"><div id="rulesBody"></div><button class="btn close" data-close aria-label="">✕</button></div>

<div id="splash"><div class="blue">
  <div class="vcr">PLAY ▶</div>
  <div id="splashLogo"><div class="title">LATE FEE<br>VIDEO</div></div>
  <div id="loadBar"><i></i><span id="loadCounter">0000</span></div>
  <button id="splashBtn" class="btn" disabled></button>
</div></div>

<div id="errScreen" class="hide"><div class="err-inner"><div class="osd-big" data-t="errTitle"></div><p id="errText"></p><button id="errBtn" class="btn" data-t="reload"></button></div></div>

<div id="replayCard" class="hide"></div>
<div id="devPanel" class="hide"></div>

<script src="js/mathdata.js"></script>
<script src="js/reelstrips.js"></script>
<script src="js/lang.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/del.js"></script>
<script src="js/net.js"></script>
<script src="js/reels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
